{% extends "base.html" %}

{% block title %}Site Under Maintenance{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="text-center">

    <!-- Logo -->
    <img src="{{ url_for('static', filename='assets/images/logo.png') }}"
         alt="Logo"
         class="img-fluid mb-4"
         style="max-width: 160px;">

    <!-- Card -->
    <div class="card shadow-sm p-4" style="max-width: 420px; margin: auto;">
      <h4 class="mb-3">We’ll Be Back Soon</h4>
      <p class="text-muted mb-0">
        Our website is currently undergoing scheduled maintenance.<br>
        Thank you for your patience.
      </p>
    </div>

  </div>
</div>
{% endblock %}
